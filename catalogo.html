<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Completo | SV3DPrints</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>

<body data-pagina="catalogo">

  <!-- ===================== ENCABEZADO Y MENÚ ===================== -->
  <header class="encabezado-principal">
    <div class="contenedor barra-navegacion">
      <details class="menu-desplegable">
        <summary class="boton-menu" aria-label="Menú de navegación">
          <span class="linea-menu" aria-hidden="true"></span>
          <span class="linea-menu" aria-hidden="true"></span>
          <span class="linea-menu" aria-hidden="true"></span>
        </summary>
        <nav aria-label="Navegación principal">
          <div class="cabecera-menu-lateral">
            <img src="img/logo.jpg" alt="" width="45" height="45">
            <span>TerraPrints 3D</span>
          </div>
        <ul class="menu-navegacion">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="catalogo.html" class="activo" aria-current="page">Catálogo</a></li>
          <li><a href="pedidos.html">Mis pedidos</a></li>
          <li id="nav-admin" hidden><a href="admin.html">Panel admin</a></li>
          <li id="nav-sesion"><a href="login.html">Iniciar sesión</a></li>
        </ul>
        </nav>
      </details>
      <a href="index.html" class="logo-marca">
        <img src="img/logo.jpg" alt="" width="45" height="45">
        <span>TerraPrints 3D</span>
      </a>
    </div>
  </header>

  <main class="contenedor seccion">
    <h1 class="titulo-seccion">Catálogo</h1>

    <!-- ===================== BÚSQUEDA, FILTROS Y ORDEN =====================
         main.js escucha los eventos "input" y "change" de este formulario y
         vuelve a dibujar las tarjetas sin recargar la página. -->
    <form id="form-filtros" class="barra-filtros" role="search" aria-label="Filtrar catálogo">
      <div class="grupo-formulario grupo-buscador">
        <label for="buscador">Buscar por nombre o tipo</label>
        <input type="search" id="buscador" name="texto" placeholder="Ej. llavero, figura, búho…" autocomplete="off">
      </div>

      <div class="grupo-formulario">
        <label for="filtro-categoria">Categoría</label>
        <!-- Las opciones de categoría se agregan desde JavaScript -->
        <select id="filtro-categoria" name="categoria">
          <option value="">Todas</option>
        </select>
      </div>

      <div class="grupo-formulario">
        <label for="orden">Ordenar por</label>
        <select id="orden" name="orden">
          <option value="nombre">Nombre (A-Z)</option>
          <option value="precio-asc">Precio: menor a mayor</option>
          <option value="precio-desc">Precio: mayor a menor</option>
          <option value="tiempo-asc">Tiempo de impresión</option>
        </select>
      </div>

      <label class="grupo-casilla" for="filtro-multicolor">
        <input type="checkbox" id="filtro-multicolor" name="multicolor">
        Solo multicolor
      </label>

      <button type="reset" class="boton-cta boton-secundario">Limpiar</button>
    </form>

    <!-- Contador: "Mostrando X de Y productos" -->
    <p id="contador-resultados" class="contador-resultados" aria-live="polite"></p>

    <!-- Contenedor de tarjetas: se llena con los productos de Firestore -->
    <div class="grilla-productos" id="catalogo"></div>
  </main>

  <!-- ===================== PIE DE PÁGINA ===================== -->
  <footer class="pie-pagina">
    <div class="contenedor pie-contenido">
      <div>
        <p><strong>TerraPrints 3D</strong></p>
        <p>Servicios de Impresión y Modelado 3D Profesional.</p>
      </div>
      <div>
        <p>Síguenos en Instagram: <a href="https://www.instagram.com/sv3dprints" target="_blank" rel="noopener noreferrer">@sv3dprints</a></p>
        <p>&copy; 2026 TerraPrints 3D. Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>

</body>
</html>
