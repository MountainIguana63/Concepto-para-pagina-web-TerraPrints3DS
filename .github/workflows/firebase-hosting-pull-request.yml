name: Deploy to Firebase Hosting on PR # Nombre que se ve en la pestaña Actions de GitHub
on: pull_request # Se ejecuta cuando alguien abre un pull request
permissions: # Permisos que necesita:
  checks: write # escribir el resultado de la revisión
  contents: read # leer el código
  pull-requests: write # comentar el link de vista previa en el pull request
jobs: # Trabajos:
  build_and_preview: # publicar una vista previa temporal
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }} # Solo si el pull request viene de este mismo repositorio (seguridad)
    runs-on: ubuntu-latest # Computadora Linux de GitHub
    steps: # Pasos:
      - uses: actions/checkout@v4 # 1. Descarga el código
      - uses: FirebaseExtended/action-hosting-deploy@v0 # 2. Publica una copia temporal (no toca la página real)
        with: # Datos que necesita:
          repoToken: ${{ secrets.GITHUB_TOKEN }} # Permiso de GitHub
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SV3DPRINTS_7769D }} # Clave secreta de Firebase (Settings → Secrets)
          projectId: sv3dprints-7769d # Nuestro proyecto de Firebase
