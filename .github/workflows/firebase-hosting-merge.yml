name: Deploy to Firebase Hosting on merge # Nombre que se ve en la pestaña Actions de GitHub
on: # Cuándo se ejecuta:
  push: # cuando alguien sube cambios (push)...
    branches: # ...a esta rama:
      - main # main. Así cada cambio en main se publica solo
jobs: # Trabajos que hace GitHub:
  build_and_deploy: # un trabajo: preparar y publicar
    runs-on: ubuntu-latest # Corre en una computadora Linux de GitHub
    steps: # Pasos:
      - uses: actions/checkout@v4 # 1. Descarga el código del repositorio
      - uses: FirebaseExtended/action-hosting-deploy@v0 # 2. Lo publica en Firebase Hosting
        with: # Datos que necesita:
          repoToken: ${{ secrets.GITHUB_TOKEN }} # Permiso de GitHub para comentar el resultado
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SV3DPRINTS_7769D }} # Clave secreta de Firebase guardada en Settings → Secrets (no está en el código)
          channelId: live # live = la página real (sv3dprints-7769d.web.app)
          projectId: sv3dprints-7769d # Nuestro proyecto de Firebase
